services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: apps/api/.env
    environment:
      NODE_ENV: development   # keep "development" so /dev/* routes work during live test
      DATABASE_URL: /data/vista.db
    volumes:
      - api_data:/data
    ports:
      - "3001:3001"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./apps/meeting-lab/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  api_data:
